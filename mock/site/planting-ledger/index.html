<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>区画一覧 | 作付け台帳</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  モック画面「作付け台帳」の区画一覧。
  ジョブ PlantingRecordExport が前提にする画面の「意味」（app/browser/screens/ledger-plot-list.js と
  app/browser/features/planting-record-export*.js の冒頭コメント）を満たすように作っている。
  画面上部の「区画コード列の位置」で、区画コード列を固定列側・通常列側のどちらにも置ける（構造の違いの確認用）。
-->
<header class="pl-header" role="banner">
  <span class="pl-brand">作付け台帳</span>
  <label class="pl-setting">区画コード列の位置
    <select id="code-side">
      <option value="fixed">固定列側</option>
      <option value="main">通常列側</option>
    </select>
  </label>
</header>
<p class="mock-banner-note">これは自動化の動作確認用のモック画面です。データは架空です。</p>
<main id="ledger-view" class="pl-main" data-view="plot-list">
  <nav aria-label="パンくず" class="pl-breadcrumb"><ol><li>ホーム</li><li>圃場</li><li aria-current="page">区画一覧</li></ol></nav>
  <h1>区画一覧</h1>
  <p class="pl-total">表示件数 <strong data-bind="plotList.total" id="plot-total">0</strong> 件</p>
  <div class="pl-grid" data-grid="plots">
    <div class="pl-grid__head">
      <table class="pl-table pl-table--fixed"><thead><tr id="head-fixed"></tr></thead></table>
      <table class="pl-table pl-table--main"><thead><tr id="head-main"></tr></thead></table>
    </div>
    <div class="pl-grid__scroll" id="grid-scroll">
      <div class="pl-grid__bodies">
        <table class="pl-table pl-table--fixed"><tbody id="body-fixed"></tbody></table>
        <table class="pl-table pl-table--main"><tbody id="body-main"></tbody></table>
      </div>
    </div>
  </div>
</main>
<aside class="pl-drawer" role="dialog" aria-label="区画詳細" hidden>
  <div class="pl-drawer__head">
    <h2 data-bind="detail.plotCode"></h2>
    <button type="button" class="pl-close" aria-label="閉じる">×</button>
  </div>
  <div class="pl-drawer__meta" id="detail-meta"></div>
  <div role="tablist" aria-label="区画詳細のタブ" class="pl-tabs">
    <button type="button" role="tab" id="tab-summary" aria-selected="true" aria-controls="panel-summary">概要</button>
    <button type="button" role="tab" id="tab-planting" aria-selected="false" aria-controls="panel-planting">作付け記録</button>
  </div>
  <section role="tabpanel" id="panel-summary" aria-labelledby="tab-summary" class="pl-panel"></section>
  <section role="tabpanel" id="panel-planting" aria-labelledby="tab-planting" class="pl-panel" hidden>
    <fieldset class="pl-kind"><legend>記録の種類</legend>
      <label><input type="radio" name="record-kind" value="planting" checked> 作付け記録</label>
      <label><input type="radio" name="record-kind" value="harvest"> 収穫記録</label>
    </fieldset>
    <table class="pl-records"><thead><tr><th>作物名</th><th>品種</th><th>定植日</th></tr></thead><tbody id="records-body"></tbody></table>
    <div class="pl-export" data-export="planting"><button type="button">CSV出力</button></div>
  </section>
</aside>
<script src="../shared/mock-data.js"></script>
<script src="../shared/mock-kit.js"></script>
<script src="app.js"></script>
</body>
</html>
